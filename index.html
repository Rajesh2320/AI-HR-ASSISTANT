<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume Upload - Batch Processing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 600px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="file"] {
      padding: 8px;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    input[type="file"]:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .file-info {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    .files-selected {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }

    .file-item {
      background: white;
      padding: 8px 10px;
      margin: 4px 0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      border-left: 3px solid #667eea;
    }

    .file-item-name {
      color: #333;
      flex: 1;
      word-break: break-all;
    }

    .file-item-size {
      color: #999;
      font-size: 12px;
      margin-left: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .progress-container {
      margin-top: 20px;
      display: none;
    }

    .progress-item {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
    }

    .progress-item.success {
      border-left-color: #4caf50;
      background: #f1f8f4;
    }

    .progress-item.error {
      border-left-color: #f44336;
      background: #fef5f5;
    }

    .progress-item.processing {
      border-left-color: #ff9800;
      background: #fff8f0;
    }

    .progress-filename {
      font-weight: 600;
      color: #333;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .progress-status {
      font-size: 12px;
      color: #666;
    }

    .progress-status.success {
      color: #4caf50;
    }

    .progress-status.error {
      color: #f44336;
    }

    .progress-status.processing {
      color: #ff9800;
    }

    .summary {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 6px;
      display: none;
      border-left: 4px solid #667eea;
    }

    .summary-item {
      font-size: 14px;
      color: #333;
      margin: 5px 0;
    }

    .summary-item strong {
      color: #667eea;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .message.success {
      background: #f1f8f4;
      color: #2e7d32;
      border: 1px solid #81c784;
      display: block;
    }

    .message.error {
      background: #fef5f5;
      color: #c62828;
      border: 1px solid #ef9a9a;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 Batch Resume Upload</h1>
    <p class="subtitle">Select multiple resumes to process</p>

    <form id="uploadForm">
      <div class="form-group">
        <label for="fileInput">Select Resumes (PDF/DOCX/TXT)</label>
        <input
          type="file"
          id="fileInput"
          name="files"
          accept=".pdf,.docx,.txt"
          multiple
          required
        />
        <div class="file-info">📁 You can select multiple files at once (PDF, DOCX, or TXT)</div>
      </div>

      <div id="filesSelected" class="files-selected" style="display: none;"></div>

      <div class="form-group">
        <label for="jobSelect">Job Position</label>
        <select id="jobSelect" required>
          <option value="">-- Select a job --</option>
          <option value="732b418d-fd35-47cc-8066-74d2f4f6bddd">Software Engineer</option>
          <option value="c3896da5-7077-414d-9ad2-7bc28d9344b8">Product Manager</option>
          <option value="da51c2fb-ff28-4333-bc6f-fc8d95ffec66">Product Designer</option>
          <option value="5aa9447c-170e-47fc-a06f-b6347ddb07ae">Collections Telecaller</option>
        </select>
      </div>

      <button type="submit">🚀 Upload & Process All</button>
    </form>

    <div id="progressContainer" class="progress-container">
      <h3 style="margin-bottom: 15px; color: #333;">Processing Status</h3>
      <div id="progressList"></div>
    </div>

    <div id="summary" class="summary">
      <div class="summary-item">✅ <strong id="successCount">0</strong> uploaded successfully</div>
      <div class="summary-item">❌ <strong id="errorCount">0</strong> had errors</div>
      <div class="summary-item">⏱️ Total time: <strong id="totalTime">0s</strong></div>
    </div>

    <div id="message" class="message"></div>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const filesSelected = document.getElementById("filesSelected");
    const uploadForm = document.getElementById("uploadForm");
    const progressContainer = document.getElementById("progressContainer");
    const progressList = document.getElementById("progressList");
    const summary = document.getElementById("summary");
    const messageDiv = document.getElementById("message");
    const jobSelect = document.getElementById("jobSelect");

    // Show selected files
    fileInput.addEventListener("change", () => {
      const files = Array.from(fileInput.files);
      if (files.length === 0) {
        filesSelected.style.display = "none";
        return;
      }

      filesSelected.innerHTML = files
        .map(
          (file) =>
            `<div class="file-item">
          <span class="file-item-name">${file.name}</span>
          <span class="file-item-size">${(file.size / 1024).toFixed(1)} KB</span>
        </div>`
        )
        .join("");
      filesSelected.style.display = "block";
    });

    // Handle form submission
    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const files = Array.from(fileInput.files);
      if (files.length === 0) {
        showMessage("Please select at least one resume", "error");
        return;
      }

      const jobId = jobSelect.value;
      if (!jobId) {
        showMessage("Please select a job position", "error");
        return;
      }

      // Reset UI
      progressList.innerHTML = "";
      summary.style.display = "none";
      messageDiv.style.display = "none";
      progressContainer.style.display = "block";
      uploadForm.style.opacity = "0.5";
      uploadForm.querySelector("button").disabled = true;

      const startTime = Date.now();
      let successCount = 0;
      let errorCount = 0;

      // Process each file
      for (const file of files) {
        await processFile(file, jobId, progressList, (success) => {
          if (success) successCount++;
          else errorCount++;
        });
      }

      // Show summary
      const endTime = Date.now();
      const totalSeconds = ((endTime - startTime) / 1000).toFixed(1);

      document.getElementById("successCount").textContent = successCount;
      document.getElementById("errorCount").textContent = errorCount;
      document.getElementById("totalTime").textContent = totalSeconds + "s";
      summary.style.display = "block";

      uploadForm.style.opacity = "1";
      uploadForm.querySelector("button").disabled = false;

      if (errorCount === 0) {
        showMessage(`✅ All ${successCount} resumes processed successfully!`, "success");
      } else {
        showMessage(
          `⚠️ ${successCount} succeeded, ${errorCount} failed. Check details above.`,
          "error"
        );
      }
    });

    async function processFile(file, jobId, container, callback) {
      const fileItem = document.createElement("div");
      fileItem.className = "progress-item processing";
      fileItem.innerHTML = `
        <div class="progress-filename">${file.name}</div>
        <div class="progress-status processing">⏳ Reading file...</div>
      `;
      container.appendChild(fileItem);

      try {
        // Read file as base64
        const fileData = await readFileAsBase64(file);
        const fileType = getFileType(file.name);

        updateProgressItem(fileItem, "🔄 Uploading...", "processing");

        // Call edge function
        const response = await fetch(
          "https://cwtkhsphaykebnqqqwcf.supabase.co/functions/v1/score-resume",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              fileData: fileData,
              fileType: fileType,
              jobId: jobId,
              name: file.name.replace(/\.[^/.]+$/, ""), // Remove extension
              email: `candidate-${Date.now()}@batch.local`, // Unique email per file
            }),
          }
        );

        const result = await response.json();

        if (response.ok && result.success) {
          updateProgressItem(
            fileItem,
            `✅ Score: ${result.score}/100 - ${result.reason}`,
            "success"
          );
          callback(true);
        } else if (result.isDuplicate) {
          updateProgressItem(fileItem, `⚠️ Duplicate submission`, "error");
          callback(false);
        } else {
          updateProgressItem(fileItem, `❌ Error: ${result.error}`, "error");
          callback(false);
        }
      } catch (error) {
        updateProgressItem(fileItem, `❌ Error: ${error.message}`, "error");
        callback(false);
      }
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const base64 = reader.result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getFileType(filename) {
      const ext = filename.split(".").pop().toLowerCase();
      if (ext === "pdf") return "pdf";
      if (ext === "docx") return "docx";
      if (ext === "txt") return "txt";
      return ext;
    }

    function updateProgressItem(element, status, className) {
      element.className = `progress-item ${className}`;
      element.querySelector(".progress-status").textContent = status;
      element.querySelector(".progress-status").className = `progress-status ${className}`;
    }

    function showMessage(text, type) {
      messageDiv.textContent = text;
      messageDiv.className = `message ${type}`;
    }
  </script>
</body>
</html>
