<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Login - AI HR Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 24px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-back {
      width: 100%;
      padding: 12px;
      background: #f0f0f0;
      color: #333;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-back:hover {
      background: #e0e0e0;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: #fef5f5;
      color: #c62828;
      border: 1px solid #ef9a9a;
      display: block;
    }

    .message.success {
      background: #f1f8f4;
      color: #2e7d32;
      border: 1px solid #81c784;
      display: block;
    }

    .divider {
      text-align: center;
      margin: 20px 0;
      color: #999;
      font-size: 13px;
    }

    .demo-credentials {
      background: #f5f7fa;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }

    .demo-credentials h3 {
      font-size: 12px;
      color: #667eea;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .demo-credentials p {
      font-size: 13px;
      color: #666;
      margin: 5px 0;
    }

    .demo-credentials code {
      background: white;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 HR Login</h1>
    <p class="subtitle">Access the HR Dashboard</p>

    <div class="demo-credentials">
      <h3>Demo Credentials</h3>
      <p>Email: <code>hr@example.com</code></p>
      <p>Password: <code>demo123</code></p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="hr@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="btn-login" id="submitBtn">Login</button>
      <button type="button" class="btn-back" onclick="goBack()">Back to Jobs</button>

      <div id="message" class="message"></div>
    </form>
  </div>

  <script>
    // Simple demo login - in production, this would validate against a real backend
    const DEMO_CREDENTIALS = {
      email: "hr@example.com",
      password: "demo123"
    };

    async function handleLogin(e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const messageDiv = document.getElementById("message");
      const submitBtn = document.getElementById("submitBtn");

      submitBtn.disabled = true;

      // Simulate login delay
      await new Promise(resolve => setTimeout(resolve, 500));

      if (email === DEMO_CREDENTIALS.email && password === DEMO_CREDENTIALS.password) {
        // Store HR user in localStorage
        localStorage.setItem("hrUser", JSON.stringify({
          email: email,
          role: "hr",
          loginTime: new Date().toISOString()
        }));

        messageDiv.textContent = "✅ Login successful! Redirecting...";
        messageDiv.className = "message success";

        setTimeout(() => {
          window.location.href = "jobs.html";
        }, 1500);
      } else {
        messageDiv.textContent = "❌ Invalid email or password. Use demo@example.com / demo123";
        messageDiv.className = "message error";
        submitBtn.disabled = false;
      }
    }

    function goBack() {
      window.location.href = "jobs.html";
    }

    // If already logged in, redirect to jobs
    document.addEventListener("DOMContentLoaded", () => {
      const hrUser = localStorage.getItem("hrUser");
      if (hrUser) {
        window.location.href = "jobs.html";
      }
    });
  </script>
</body>
</html>
