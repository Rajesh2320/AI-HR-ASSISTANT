<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Login - AI HR Assistant</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --text-color: #1f2937;
      --bg-color: #f9fafb;
      --border-color: #e5e7eb;
      --error-color: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-color);
    }

    .login-container {
      background: white;
      padding: 48px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }

    .login-container h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: center;
      color: var(--primary-color);
    }

    .login-container .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 32px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-color);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    button:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    .error-message {
      color: var(--error-color);
      background-color: #fee2e2;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid var(--error-color);
      font-size: 13px;
    }

    .back-link {
      text-align: center;
      margin-top: 20px;
    }

    .back-link a {
      color: var(--primary-color);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .demo-credentials {
      background-color: #f0f9ff;
      border: 1px solid #bfdbfe;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 24px;
      font-size: 12px;
      color: #1e40af;
    }

    .demo-credentials strong {
      display: block;
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 20px;
      }

      .login-container h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>HR Login</h1>
    <p class="subtitle">Access the HR Dashboard</p>

    <div id="errorMessage"></div>

    <div class="demo-credentials">
      <strong>Demo Credentials:</strong>
      Email: hr@example.com<br>
      Password: demo123
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="hr@example.com"
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          placeholder="Enter password"
          autocomplete="current-password"
        >
      </div>

      <button type="submit">Login</button>
      <button type="button" onclick="backToJobs()" style="background-color: #6b7280; margin-top: 12px;">Back to Jobs</button>
    </form>

    <div class="back-link">
      <a href="jobs.html">← Back to Open Positions</a>
    </div>
  </div>

  <script>
    // Configuration
    const SUPABASE_URL = 'https://cwtkhsphaykebnqqqwcf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3dGtoc3BoYXlrZWJucXFxd2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5NzM4MzgsImV4cCI6MjEwNTU0OTgzOH0.Kia5M7o9BqmO5OgzxXBxeE2--2p4nI_BflXnEORJpgY';

    // Demo credentials
    const DEMO_EMAIL = 'hr@example.com';
    const DEMO_PASSWORD = 'demo123';

    // Check if already logged in
    window.addEventListener('DOMContentLoaded', function() {
      const hrUser = localStorage.getItem('hrUser');
      if (hrUser) {
        window.location.href = 'jobs.html';
      }
    });

    // Handle login form
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      // Clear previous error
      errorDiv.innerHTML = '';

      // Validate credentials
      if (email === DEMO_EMAIL && password === DEMO_PASSWORD) {
        // Store user info in localStorage
        const hrUser = {
          email: email,
          role: 'hr',
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('hrUser', JSON.stringify(hrUser));

        // Redirect to jobs page
        window.location.href = 'jobs.html';
      } else {
        // Show error
        errorDiv.innerHTML = `
          <div class="error-message">
            <strong>Login failed.</strong> Invalid email or password. Please try again.
          </div>
        `;
      }
    });

    function backToJobs() {
      window.location.href = 'jobs.html';
    }
  </script>
</body>
</html>
